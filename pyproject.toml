[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlengine-mcp"
version = "2.0.1"
description = "HTTP web extraction, browser header rotation, proxy pool management, and clean Markdown MCP server for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Johann Schiffer"}
]
keywords = ["mcp", "model-context-protocol", "web-scraping", "crawler", "markdown", "claude", "cursor", "ai-agent"]
dependencies = [
    "httpx[socks]>=0.26.0",
    "beautifulsoup4>=4.12.0"
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
crawlengine-mcp = "crawlengine.server:main"
crawlengine-cli = "crawlengine.cli:main"

[tool.setuptools.packages.find]
include = ["crawlengine*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[project.urls]
Homepage = "https://github.com/johannschiffer/crawlengine-mcp"
Documentation = "https://github.com/johannschiffer/crawlengine-mcp#readme"
Repository = "https://github.com/johannschiffer/crawlengine-mcp"
Issues = "https://github.com/johannschiffer/crawlengine-mcp/issues"
Funding = "https://ko-fi.com/johannschiffer"
