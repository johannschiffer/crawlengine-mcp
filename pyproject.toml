[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlengine-mcp"
version = "2.0.0"
description = "Anti-bot web scraping, proxy rotation, and clean markdown extraction MCP server for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Johann Schiffer"}
]
keywords = ["mcp", "model-context-protocol", "web-scraping", "crawler", "markdown", "claude", "cursor", "ai-agent"]
dependencies = [
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0"
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
crawlengine-mcp = "crawlengine.server:main"
crawlengine-cli = "crawlengine.cli:main"

[tool.setuptools.packages.find]
include = ["crawlengine*"]

[project.urls]
Homepage = "https://johannschiffer.github.io"
Documentation = "https://johannschiffer.github.io"
Repository = "https://github.com/johannschiffer/crawlengine-mcp"
Issues = "https://github.com/johannschiffer/crawlengine-mcp/issues"
Funding = "https://ko-fi.com/johannschiffer"
